[build-system]
requires = ["setuptools", "numpy"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["interval"]

[project]
name = "npinterval"
version = "0.0.2"
dependencies = [
    "numpy",
]

# Boost.Interval is a header-only C++ library and is not a Python package,
# so it must be installed separately (e.g. via `apt install libboost-dev`
# or `brew install boost`).
